name: Verify live Badugi multiplayer
on:
  workflow_run:
    workflows: ["Deploy Badugi to GitHub Pages"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-badugi-multiplayer-test
  cancel-in-progress: true
jobs:
  online-e2e:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test tools
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify real public room create, guest join, betting, draw and showdown
        run: python tests/online_e2e.py
      - name: Verify 5-player public room entry, rejection and rejoining
        run: python tests/online_capacity.py
      - name: Save screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: badugi-online-e2e-screenshots
          path: test-artifacts/
          if-no-files-found: ignore
